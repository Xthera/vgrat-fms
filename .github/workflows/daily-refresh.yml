name: Daily fund data refresh

# Runs every day at 8:00am Singapore Time (SGT = UTC+8, so 00:00 UTC),
# plus can be triggered manually from the Actions tab any time.
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright openpyxl
          playwright install --with-deps chromium

      - name: Scrape latest fund data
        run: python scripts/scrape_funds.py --urls Funds_Links.xlsm

      - name: Commit updated data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet && echo "No changes" || git commit -m "Daily fund data refresh"
          git push
