name: Debug single fund (holdings/fields)

# Manual-only diagnostic run: processes just the 2nd fund in
# Funds_Links.xlsm (PRULink ActiveInvest Portfolio - Conservative) with
# full debug output, and does NOT touch data.json (--dry-run). Use this
# to see exactly which fields/holdings extraction is failing for a
# specific fund without waiting for or affecting the real daily refresh.
on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install playwright openpyxl pdfplumber requests
          playwright install --with-deps chromium

      - name: Debug run (fund #2, dry-run, verbose)
        run: python scripts/scrape_funds.py --urls Funds_Links.xlsm --limit 2 --debug --dry-run
